<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Bomberman 4 — Era Primitiva · Fan Remake</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='9' r='6' fill='%23333'/><rect x='7' y='1' width='2' height='3' fill='%23c8a850'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cab">
  <header class="top">
    <span class="brand">SUPER&nbsp;BOMBERMAN&nbsp;<em>4</em></span>
    <span class="sub">fan remake · mundo 1 · era primitiva</span>
  </header>

  <div class="tv">
    <canvas id="game" width="256" height="224"></canvas>
    <i class="scan" aria-hidden="true"></i>
  </div>

  <section class="pad">
    <span class="chip"><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> mover</span>
    <span class="chip"><kbd>Z</kbd>/<kbd>Espaço</kbd> bomba</span>
    <span class="chip"><kbd>X</kbd> soco · segurar = arremessar</span>
    <span class="chip"><kbd>Enter</kbd> iniciar/pausa</span>
    <span class="chip"><kbd>←→</kbd> escolher área (título)</span>
    <span class="chip"><kbd>M</kbd> som</span>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
